<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- 宣纸底 -->
  <rect width="1000" height="700" fill="#efe7d4"/>
  <rect width="1000" height="700" fill="url(#grain)" opacity=".5"/>
  <defs>
    <radialGradient id="grain" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#faf5e8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#e6dcc2" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ba9b4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#9fc3cb" stop-opacity=".28"/>
    </linearGradient>
  </defs>

  <!-- 远山 -->
  <g stroke="#6f6450" fill="none" stroke-width="2.4" stroke-linecap="round" opacity=".34">
    <path d="M0 150 C120 96 210 140 300 104 C380 72 460 118 540 96 C620 74 700 110 780 88 C840 72 900 92 1000 66"/>
    <path d="M40 190 C150 148 240 182 330 152 C420 122 520 160 620 136 C700 118 800 150 1000 118"/>
    <path d="M-20 260 C100 220 220 246 340 214 C460 182 580 224 700 196 C820 168 920 198 1020 176"/>
  </g>
  <!-- 山体淡染 -->
  <g fill="#6f6450" opacity=".07">
    <path d="M0 150 C120 96 210 140 300 104 C380 72 460 118 540 96 C620 74 700 110 780 88 C840 72 900 92 1000 66 L1000 300 C860 240 700 280 540 240 C380 200 200 240 0 260 Z"/>
  </g>

  <!-- 漳河支流（对角） -->
  <path d="M-20 520 C160 470 300 540 470 486 C640 432 800 500 1020 438 L1020 700 L-20 700 Z" fill="url(#river)"/>
  <path d="M-20 540 C160 490 300 560 470 506 C640 452 800 520 1020 458" stroke="#4f7f8c" stroke-width="2.6" fill="none" opacity=".5" stroke-linecap="round"/>
  <path d="M-20 560 C160 510 300 580 470 526 C640 472 800 540 1020 478" stroke="#4f7f8c" stroke-width="1.4" fill="none" opacity=".3"/>

  <!-- 梯田（左下） -->
  <g stroke="#7a6d4e" fill="none" stroke-width="2" opacity=".5" stroke-linecap="round">
    <path d="M60 660 C180 632 300 652 420 630"/>
    <path d="M40 622 C160 594 300 614 430 590"/>
    <path d="M20 584 C150 556 290 576 440 550"/>
    <path d="M-10 546 C140 518 280 538 450 510"/>
  </g>
  <g fill="#7a6d4e" opacity=".28" font-family="serif" font-size="15" text-anchor="middle">
    <text x="230" y="618">田</text><text x="330" y="578">田</text><text x="120" y="600">田</text>
  </g>

  <!-- 主路：镇道（左→村） -->
  <path d="M-20 330 C180 318 320 342 470 330 C600 320 720 338 840 322" stroke="#8a7a5c" stroke-width="7" fill="none" opacity=".75"/>
  <path d="M-20 330 C180 318 320 342 470 330 C600 320 720 338 840 322" stroke="#f4eddc" stroke-width="1.6" fill="none" stroke-dasharray="14 12" opacity=".8"/>

  <!-- 村内巷道 -->
  <g stroke="#8a7a5c" stroke-width="3" fill="none" opacity=".55">
    <path d="M640 300 C660 280 700 268 760 262"/>
    <path d="M620 350 C660 338 720 330 790 326"/>
    <path d="M600 400 C650 392 710 388 770 386"/>
  </g>

  <!-- 村落房舍 -->
  <g fill="#8d7a55" opacity=".30">
    <rect x="560" y="300" width="46" height="30" rx="4"/>
    <rect x="616" y="296" width="52" height="32" rx="4"/>
    <rect x="678" y="292" width="58" height="30" rx="4"/>
    <rect x="744" y="288" width="48" height="32" rx="4"/>
    <rect x="806" y="284" width="42" height="30" rx="4"/>
    <rect x="552" y="342" width="50" height="32" rx="4"/>
    <rect x="612" y="338" width="44" height="34" rx="4"/>
    <rect x="666" y="336" width="56" height="32" rx="4"/>
    <rect x="732" y="334" width="46" height="34" rx="4"/>
    <rect x="788" y="332" width="50" height="32" rx="4"/>
    <rect x="560" y="388" width="42" height="30" rx="4"/>
    <rect x="612" y="384" width="56" height="32" rx="4"/>
    <rect x="680" y="382" width="44" height="30" rx="4"/>
    <rect x="734" y="380" width="54" height="32" rx="4"/>
  </g>

  <!-- 公共设施点位（大宅院） -->
  <g stroke="#a63a2a" fill="none" stroke-width="2.4">
    <rect x="596" y="252" width="40" height="28" rx="3"/>   <!-- 村委会 -->
    <rect x="692" y="248" width="34" height="26" rx="3"/>   <!-- 文化广场 -->
    <rect x="846" y="318" width="36" height="26" rx="3"/>   <!-- 卫生室 -->
    <rect x="524" y="434" width="40" height="28" rx="3"/>   <!-- 代养牛场 -->
    <rect x="640" y="448" width="32" height="26" rx="3"/>   <!-- 饮水工程 -->
  </g>
  <g font-family="serif" font-size="13" fill="#6f5a30" opacity=".92">
    <text x="590" y="242">村委会</text>
    <text x="686" y="238">文化广场</text>
    <text x="842" y="308">卫生室</text>
    <text x="516" y="424">代养牛场</text>
    <text x="632" y="438">饮水工程</text>
  </g>

  <!-- 连翘坡（村南） -->
  <g stroke="#b07c1f" fill="none" stroke-width="1.8" opacity=".55">
    <path d="M480 330 C520 316 580 324 640 312"/>
    <path d="M470 360 C510 346 570 354 630 342"/>
    <path d="M460 390 C500 376 560 384 620 372"/>
  </g>
  <g fill="#b07c1f" opacity=".5" font-family="serif" font-size="14" text-anchor="middle">
    <circle cx="600" cy="330" r="2.4"/><circle cx="620" cy="336" r="2.4"/><circle cx="612" cy="326" r="2.4"/>
    <circle cx="580" cy="370" r="2.4"/><circle cx="596" cy="364" r="2.4"/>
  </g>
  <text x="548" y="352" font-family="serif" font-size="13" fill="#8a6d3b" opacity=".9">连翘坡</text>

  <!-- 核桃林（村北） -->
  <g stroke="#3f7d5c" fill="none" stroke-width="1.6" opacity=".6">
    <circle cx="860" cy="150" r="14"/><circle cx="892" cy="140" r="16"/><circle cx="918" cy="156" r="13"/>
    <circle cx="830" cy="172" r="12"/><circle cx="900" cy="172" r="14"/>
  </g>
  <text x="856" y="210" font-family="serif" font-size="13" fill="#3f6d50" opacity=".9">核桃林</text>

  <!-- 罗盘与图注 -->
  <g transform="translate(60,64)">
    <circle r="26" fill="none" stroke="#5b5347" stroke-width="1.6" opacity=".7"/>
    <path d="M0 -20 L5 6 L0 0 L-5 6 Z" fill="#a63a2a"/>
    <text x="0" y="-30" font-family="serif" font-size="16" fill="#5b5347" text-anchor="middle">北</text>
    <path d="M-24 0 A24 24 0 0 1 24 0" fill="none" stroke="#5b5347" stroke-width="1" opacity=".5"/>
  </g>
  <g transform="translate(880,620)" font-family="serif" font-size="13" fill="#8a8071">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#8a8071" stroke-width="2"/>
    <text x="40" y="18" text-anchor="middle">示意比例尺</text>
  </g>
  <text x="500" y="686" font-family="serif" font-size="14" fill="#8a8071" text-anchor="middle" letter-spacing="6">枣 畔 村 · 水 墨 舆 图（种子示例底图）</text>
</svg>
